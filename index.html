<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <title>Артур и Дарья</title>
  <meta name="description" content="Свадебное приглашение">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="sm-page">
    <section class="sm-lead sm-section-bg sm-section-light">
      <div class="sm-section-decor"></div>
      <div class="sm-decor sm-decor-line sm-left-bottom item-animation item-atop"></div>
      <div class="sm-container">
        <div class="sm-lead-date item-animation item-atop">
          <span class="sm-lead-date-section" data-sm-day></span>
          <span class="sm-lead-date-section" data-sm-month></span>
          <span class="sm-lead-date-section" data-sm-year></span>
        </div>
        <div class="sm-lead-names sm-title">
          <div class="sm-lead-names-content">
            <div class="sm-lead-name">
              <span data-sm-text="GROOM"></span>
            </div>
            <span class="sm-lead-and item-animation item-atop"></span>
            <div class="sm-lead-name item-animation item-atop">
              <span data-sm-text="BRIDE"></span>
            </div>
          </div>
          <div class="sm-decor sm-decor01 item-animation item-aright"></div>
          <div class="sm-decor sm-decor02 item-animation item-aleft"></div>
        </div>
        <div class="sm-lead-image item-animation item-abottom">
          <img src="" data-sm-src="COVER_PHOTO" alt="Обложка приглашения">
        </div>
        <div class="sm-helper item-animation item-atop">
          <button class="sm-helper-button" type="button" data-scroll-next>
            <span class="sm-button-title">Листайте вниз</span>
            <span class="sm-button-ico">
              <svg xmlns="http://www.w3.org/2000/svg" width="12" height="7" viewBox="0 0 12 7" fill="none">
                <path d="M0.279123 1.09196C0.125585 0.938124 0.125585 0.687853 0.279123 0.534013C0.432951 0.380346 0.682501 0.381122 0.836384 0.534703L5.81237 5.51069L10.789 0.534013C10.9429 0.380196 11.1931 0.380382 11.347 0.534013C11.5009 0.687922 11.5009 0.938054 11.347 1.09196L5.81306 6.6259L0.279123 1.09196Z" fill="currentColor"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </section>

    <section class="sm-datetime sm-section-bg sm-section-dark">
      <div class="sm-section-decor"></div>
      <div class="sm-decor sm-decor-line sm-right-top item-animation item-abottom"></div>
      <div class="sm-decor sm-decor-line sm-left-bottom item-animation item-atop"></div>
      <div class="sm-container">
        <div class="sm-decor sm-decor-flower01 item-rotate-scroll"></div>
        <div class="sm-section__text">
          <div class="sm-decor sm-decor02 item-animation item-aright"></div>
          <h2 class="sm-title item-animation item-atop" data-sm-text="HELLO_TITLE"></h2>
          <div class="sm-subtitle item-animation item-abottom" data-sm-text="MAIN_TEXT_CALENDAR"></div>
          <div class="sm-text item-animation item-atop" data-sm-text="HELLO_TEXT"></div>
        </div>
        <div class="sm-calendar__wrapper item-animation item-abottom">
          <div class="sm-decor sm-decor02 item-animation item-aleft"></div>
          <div class="sm-calendar__date">
            <span class="item-animation item-aleft" data-sm-day></span>
            <span class="item-animation item-aright" data-sm-month></span>
            <span class="item-animation item-aleft" data-sm-year></span>
          </div>
          <div class="sm-calendar__box">
            <div class="sm-calendar__month" data-sm-tmonth></div>
            <div class="sm-calendar" data-calendar></div>
          </div>
        </div>
      </div>
    </section>

    <section class="sm-location sm-section-bg sm-section-light">
      <div class="sm-section-decor"></div>
      <div class="sm-container">
        <div class="sm-section__text">
          <h2 class="sm-title item-animation item-abottom" data-sm-text="LOCATION_TITLE"></h2>
          <h2 class="sm-subtitle item-animation item-atop" data-sm-text="LOCATION_SUBTITLE"></h2>
          <div class="sm-text item-animation item-atop" data-sm-text="LOCATION_TEXT"></div>
        </div>
        <div class="sm-ico item-animation item-atop">
          <img src="./assets/pin.gif" alt="Место">
        </div>
        <div class="sm-location__image item-animation item-atop">
          <div class="sm-img">
            <img src="" data-sm-src="LOCATION_PHOTO" alt="Локация">
          </div>
        </div>
        <a class="sm-btn sm-text-font item-animation item-atop" data-sm-href="LOCATION_MAP" target="_blank" rel="noreferrer">Как добраться</a>
      </div>
    </section>

    <section class="sm-timing sm-section-bg sm-section-dark">
      <div class="sm-section-decor"></div>
      <div class="sm-decor sm-decor-line sm-right-top item-animation item-abottom"></div>
      <div class="sm-decor sm-decor-line sm-left-bottom item-animation item-atop"></div>
      <div class="sm-container">
        <div class="sm-decor sm-decor-flower02 item-animation item-aleft"></div>
        <h2 class="sm-title item-animation item-atop" data-sm-text="TIMING_TITLE"></h2>
        <h2 class="sm-subtitle item-animation item-atop" data-sm-text="TIMING_SUBTITLE"></h2>
        <div class="sm-timing__items">
          <div class="sm-timing__item item-animation item-aleft">
            <div class="sm-timing__item__time sm-title-font" data-sm-text="TIMING_1_0"></div>
            <div class="sm-timing__item__title sm-text-font" data-sm-text="TIMING_1_1"></div>
          </div>
          <div class="sm-timing__item item-animation item-aright">
            <div class="sm-timing__item__time sm-title-font" data-sm-text="TIMING_2_0"></div>
            <div class="sm-timing__item__title sm-text-font" data-sm-text="TIMING_2_1"></div>
          </div>
          <div class="sm-timing__item item-animation item-aleft">
            <div class="sm-timing__item__time sm-title-font" data-sm-text="TIMING_3_0"></div>
            <div class="sm-timing__item__title sm-text-font" data-sm-text="TIMING_3_1"></div>
          </div>
          <div class="sm-timing__item item-animation item-aright">
            <div class="sm-timing__item__time sm-title-font" data-sm-text="TIMING_4_0"></div>
            <div class="sm-timing__item__title sm-text-font" data-sm-text="TIMING_4_1"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="sm-section-wrap sm-section-bg sm-section-dark">
      <div class="sm-section-decor background-no-paint"></div>
      <section class="sm-time">
        <div class="sm-decor sm-decor-line sm-right-top item-animation item-abottom"></div>
        <div class="sm-decor sm-decor-line sm-left-bottom item-animation item-atop"></div>
        <div class="sm-container">
          <div class="sm-box background-paint-background">
            <h2 class="sm-title item-animation item-atop" data-sm-text="TIMER_TITLE"></h2>
            <h3 class="sm-subtitle item-animation item-atop" data-sm-text="TIMER_SUBTITLE"></h3>
            <div class="sm-time__box background-paint-background-before background-paint-background-after">
              <div class="sm-time__item">
                <div class="sm-time__item_number item-animation item-aright" id="days"></div>
                <p class="sm-time__item__title" id="days-title">Дней</p>
              </div>
              <div class="sm-time__item">
                <div class="sm-time__item_number item-animation item-aright" id="hours"></div>
                <p class="sm-time__item__title" id="hours-title">Часов</p>
              </div>
              <div class="sm-time__item">
                <div class="sm-time__item_number item-animation item-aleft" id="minutes"></div>
                <p class="sm-time__item__title" id="minutes-title">Минут</p>
              </div>
              <div class="sm-time__item">
                <div class="sm-time__item_number item-animation item-aleft" id="seconds"></div>
                <p class="sm-time__item__title" id="seconds-title">Секунд</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="sm-wishes sm-section-type-1">
        <div class="sm-container">
          <h2 class="sm-title item-animation item-atop" data-sm-text="WISH_TITLE"></h2>
          <h3 class="sm-subtitle item-animation item-atop" data-sm-text="WISH_SUBTITLE"></h3>
          <div class="sm-slider-wrap item-animation item-atop">
            <div class="sm-slider sm-wishes__content-slider">
              <div class="sm-wishes__content-item is-active" data-slide-index="0">
                <div class="sm-wishes__content-slide" data-sm-text="WISH_TEXT_ITEMS_0"></div>
              </div>
              <div class="sm-wishes__content-item" data-slide-index="1">
                <div class="sm-wishes__content-slide" data-sm-text="WISH_TEXT_ITEMS_1"></div>
              </div>
              <div class="sm-wishes__content-item" data-slide-index="2">
                <div class="sm-wishes__content-slide" data-sm-text="WISH_TEXT_ITEMS_2"></div>
              </div>
            </div>
            <div class="sm-wishes__pagination-wrapper">
              <button class="sm-arrow sm-arrow-prev" type="button" data-wish-prev>
                <img src="./assets/arrow.svg" alt="Предыдущее пожелание">
              </button>
              <div class="sm-wishes__pagination">
                <span data-current-slide>1</span>
                <span>/</span>
                <span data-total-slides>3</span>
              </div>
              <button class="sm-arrow sm-arrow-next" type="button" data-wish-next>
                <img src="./assets/arrow.svg" alt="Следующее пожелание">
              </button>
            </div>
          </div>
          <a href="#" class="sm-btn item-animation item-abottom is-hidden" data-sm-href="WISH_WISHLIST">Смотреть список подарков</a>
        </div>
      </section>
    </div>

    <section class="sm-contact sm-section-bg sm-section-light">
      <div class="sm-section-decor"></div>
      <div class="sm-container">
        <div class="sm-decor sm-decor03 item-animation item-aleft"></div>
        <div class="sm-decor sm-decor03 item-animation item-aright"></div>
        <div class="sm-decor sm-decor-flower02 item-animation item-aleft"></div>
        <div class="sm-decor sm-decor-flower04 item-rotate-scroll"></div>
        <div class="sm-contact__box">
          <h2 class="sm-title sm-title-font item-animation item-atop" data-sm-text="CONTACTS_TITLE"></h2>
          <div class="sm-contact_photo item-animation item-abottom">
            <div class="sm-photo">
              <img src="" data-sm-src="CONTACTS_PHOTO_ONE" alt="Контакты">
            </div>
          </div>
          <p class="sm-text item-animation item-atop" data-sm-text="CONTACTS_TEXT"></p>
        </div>
        <div class="sm-contact__info sm-title-font">
          <span data-sm-text="CONTACTS_NAME" class="item-animation item-aright"></span><br>
          <a href="tel:" data-sm-tel="GROOM_TEL" class="item-animation item-aleft"></a><br>
        </div>
      </div>
    </section>

    <div class="sm-section-wrap sm-section-bg sm-section-dark">
      <div class="sm-section-decor"></div>
      <section class="sm-footer">
        <div class="sm-decor sm-decor-line sm-left-bottom item-animation item-atop"></div>
        <div class="sm-container">
          <div class="sm-text sm-text-font item-animation item-atop" data-sm-text="BYE_SUBTITLE"></div>
          <div class="sm-text sm-text-font item-animation item-atop" data-sm-text="BYE_TITLE"></div>
          <div class="sm-footer__names">
            <div class="item-animation item-aleft">
              <span data-sm-text="GROOM"></span>
              <span>&</span>
            </div>
            <div class="item-animation item-aright">
              <span data-sm-text="BRIDE"></span>
            </div>
          </div>
          <div class="sm-footer__image item-animation item-abottom">
            <div class="sm-img">
              <img src="" data-sm-src="BYE_PHOTO_ONE" alt="Финальное фото">
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="./main.js"></script>
</body>
</html>
